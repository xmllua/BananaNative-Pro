# One Gradle at a time per worktree and no daemon left behind: several agents build in parallel on a 24 GB Mac, and idle 3 GB daemons once ran it out of memory
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
android.nonTransitiveRClass=true
# The games the APK runs (dm/games/<title ID>), each in a host of its own (libnxhost_<title ID>.so: the host has its profile compiled in, as dm/host/Makefile's GAME).
# nxGames is every game Banana Native supports on Android, the first the default: the profiles with a status row in their readiness.tsv (dm/games/README.md "Readiness
# rows"; dm/tools/tests/test_android_games.py keeps the two the same), so a test or release build never lacks one. -PnxGames=<title ID>,<title ID>,... builds a smaller APK
# (a game's bring-up, -PnxApp)
nxGames=040074A01BF12000,0400C3F00006E000,0400486024DEC000,0400A3A01EE4C000,0400380020056000,04007EF01F8AE000
