// The nxnative launcher: one APK with the host (libnxhost.so, built from android/host) and the launcher's JNI shim (libnxlaunch.so). No game code and no game data:
// the user's pack and game folder stay on the phone's storage (android/README.md, android/TESTING.md)
plugins {
    id 'com.android.application' version '8.13.2'
}

// The games this APK runs: -PnxGames=<title ID>,<title ID>,... (default: gradle.properties' nxGames, every game supported on Android). Each has its profile (dm/games/<title ID>) compiled into a host of its
// own, libnxhost_<title ID>.so with its libnxlaunch_<title ID>.so (src/main/cpp/CMakeLists.txt): the host has its profile compiled in, as dm/host/Makefile's GAME, so a game
// runs only in an APK built with its profile. The first is the default (the graphics self-test loads its host)
def nxGames = (providers.gradleProperty('nxGames').getOrElse('') ?: providers.gradleProperty('nxGame').getOrElse('')).split(',').collect { it.trim() }.findAll { it }.unique()
if (!nxGames) throw new GradleException('nxGames: no game (gradle.properties names every supported one; -PnxGames=<title ID>,... builds fewer)')
nxGames.each { g ->
    if (!(g ==~ /[0-9A-F]{16}/)) throw new GradleException("nxGames: each game must be a title ID (16 upper-case hex digits), not $g")
}
// -PnxPlay=true builds a second app (dev.nxnative.android.play, "Banana Native") that installs beside the test app, so test installs leave it alone
def nxPlay = providers.gradleProperty('nxPlay').getOrElse('false') == 'true'
// -PnxApp=<suffix> builds another test app, dev.nxnative.android.<suffix> ("Banana Native <suffix>", or -PnxLabel), beside the test app: one game's bring-up (-PnxApp=mkw) installs
// without replacing the test app other agents run. It is a test app (saves-test/), with its own files folder (Android/data/dev.nxnative.android.<suffix>/files: env.txt, logs)
def nxApp = providers.gradleProperty('nxApp').getOrElse('')
if (nxApp && !(nxApp ==~ /[a-z][a-z0-9]*/)) throw new GradleException("nxApp must be lower-case letters and digits, not $nxApp")
if (nxApp && nxPlay) throw new GradleException('nxApp and nxPlay build different apps: give one of them')
// -PnxLive=true builds the public release (dev.bananative.android, "Banana Native"): the play app's behaviour (saves/<id>, no test switches), not debuggable, signed
// with the release key named by the environment (NX_SIGN_STORE, NX_SIGN_ALIAS, NX_SIGN_PASS; the key never lives in this repository). -PnxVersion sets its version
def nxLive = providers.gradleProperty('nxLive').getOrElse('false') == 'true'
if (nxLive && (nxPlay || nxApp)) throw new GradleException('nxLive builds the release app: give neither nxPlay nor nxApp')
def nxVersion = providers.gradleProperty('nxVersion').getOrElse('0.1-bringup')
def nxVersionCode = providers.gradleProperty('nxVersionCode').getOrElse('1') as int
def signStore = System.getenv('NX_SIGN_STORE'), signAlias = System.getenv('NX_SIGN_ALIAS'), signPass = System.getenv('NX_SIGN_PASS')
if (nxLive && !(signStore && signAlias && signPass && new File(signStore).isFile()))
    throw new GradleException('nxLive needs the release key: NX_SIGN_STORE (an existing keystore), NX_SIGN_ALIAS and NX_SIGN_PASS')
def nxLabel = providers.gradleProperty('nxLabel').getOrElse(nxApp ? "Banana Native $nxApp" : '')
// The build tag the launcher shows over the game and in its main screen, and writes as the first line of each game log: branch@commit[+dirty] (no build time: the commit and the signer identify a build)
def gitOut = { List<String> a -> try { providers.exec { commandLine(['git'] + a); ignoreExitValue = true }.standardOutput.asText.get().trim() } catch (Exception e) { '' } }
def commit = gitOut(['rev-parse', '--short=12', 'HEAD'])
def branch = gitOut(['rev-parse', '--abbrev-ref', 'HEAD'])
def dirty = gitOut(['status', '--porcelain', '--untracked-files=no']) ? '+dirty' : ''
// Lossless Scaling frame generation (GPL-3.0-or-later, dm/gfx/vk_android/lsfg): in by default, which makes the APK GPL-3.0-or-later; -PnxLsfg=false builds without it (the packer's libdmsh_xlate.so is GPL-3.0-or-later too: android/NOTICE.md)
def nxLsfg = providers.gradleProperty('nxLsfg').getOrElse('true') != 'false'
// Preparing the game on the phone (android/ONDEVICE.md): "+ Add game" on a dump without a usable pack offers Prepare, which runs PackService (a foreground service
// in :pack) with the embedded packer: CPython 3.14 with the repository's tools, the translator (libdmsh_xlate.so) and SPIRV-Tools (libSPIRV-Tools-shared.so). Part of
// every APK (test and play). -PnxPackStage=<android/ondevice/build.sh work dir>/stage (or NX_PACK_STAGE) names the native side's stage; -PnxPackEngine=fake builds a
// simulated engine instead (FakeEngine: the flow without the tools, for UI work; no stage needed, the pack it makes is a placeholder that is never started)
def nxPackEngine = providers.gradleProperty('nxPackEngine').getOrElse('native')
if (!(nxPackEngine in ['fake', 'native'])) throw new GradleException("nxPackEngine must be native or fake, not $nxPackEngine")
// What the on-device job checks a dump against and stamps its outputs with: the profile's builds (game.tsv build rows: version, then module=NSO build ID) and the
// shader chain versions (a job translated with other versions starts its translation over, ONDEVICE.md "Versions")
def repo = file('../..')
nxGames.each { g -> if (!new File(repo, "dm/games/$g/game.tsv").isFile()) throw new GradleException("nxGames: $g has no profile (dm/games/$g/game.tsv)") }
def tsvRows = { String game, String key -> def t = new File(repo, "dm/games/$game/game.tsv"); t.isFile() ? t.readLines().findAll { it.startsWith(key + '\t') }.collect { it.split('\t') } : [] }
def buildsOf = { String game -> tsvRows(game, 'build').collect { c -> def m = (c[1] =~ /\d+/); (m.find() ? m.group() : c[1]) + (c.size() > 2 && c[2] ==~ /\d+(\.\d+)+/ ? ' @' + c[2] : '') + ' ' + c.drop(3).join(' ') }.join(';') }   // "<version> [@<display version>] <module>=<build ID> ..."
def nameOf = { String game -> tsvRows(game, 'name').collect { it[1] }.find() ?: game }
def defineOf = { String path, String name -> def f = new File(repo, path); def m = f.isFile() ? (f.text =~ /#define\s+${name}\s+"([^"]*)"/) : null; (m != null && m.find()) ? m.group(1) : 'unknown' }
// The shaders Prepare builds: every key of the profile's shader_map.tsv, or for a profile with a selected set (shader_seen.tsv; ShaderLibs.selection, android/SHADERS.md
// "Selected shaders") the set's keys that the map has, with the pixel shaders paired with them (shader_pairs.tsv, pso_pairs.tsv: dmsh_build.py build_keys, the tool's total)
def shaderKeysOf = { String game ->
    def f = new File(repo, "dm/games/$game/shader_map.tsv"); if (!f.isFile()) return [] as Set
    def map = f.readLines().findAll { it && !it.startsWith('#') && !it.startsWith('package\t') }.collect { it.split('\t') }.findAll { it.size() > 3 }.collect { it[3] } as Set
    def seen = new File(repo, "dm/games/$game/shader_seen.tsv"); if (!seen.isFile()) return map
    def sel = seen.readLines().findAll { it ==~ /(?s)[0-9a-f]{16}.*/ }.collect { it.substring(0, 16) }.findAll { it in map } as Set
    def keys = new HashSet(sel)
    ['shader_pairs.tsv', 'pso_pairs.tsv'].each { t -> def pf = new File(repo, "dm/games/$game/$t"); if (pf.isFile()) pf.eachLine { l -> if (l.trim() && !l.startsWith('#')) { def c = l.trim().split(/\s+/); if (c.size() == 2 && c[0] in sel && c[1] in map) keys << c[1] } } }
    keys
}
def shaderTotalOf = { String game -> shaderKeysOf(game).size() }
def nxRewriter = { def m = (new File(repo, 'scripts/pack_android.py').text =~ /(?m)^REWRITER = \(([^)]*)\)/); if (!m.find()) throw new GradleException('scripts/pack_android.py has no REWRITER tuple'); (m.group(1) =~ /'([^']+)'/).collect { it[1] }.join(' ') }()
def shaderInputsOf = { String game -> try { def r = providers.exec { commandLine('python3', new File(repo, 'dm/gfx/tools/dmsh_chain.py').path, '--inputs'); environment('DM_GAME', game); ignoreExitValue = true }.standardOutput.asText.get().trim(); r ==~ /[0-9a-f]{12}/ ? r : 'unknown' } catch (Exception e) { 'unknown' } }
// The games' profiles as the launcher reads them (Profile.java): one line per game, tab-separated: title ID, name, the shader count Prepare translates (shaderTotalOf:
// vk_android_build.py's total), the shader inputs digest (dmsh_chain.py --inputs: a pack's library is current only when its stamp
// shaders/v-<V>/inputs.tsv names it, as pack_android.py's library_current asks; "unknown" without a Python 3 at build time: the launcher then checks the library's path
// only), and the profile's builds (game.tsv build rows: version, then module=NSO build ID, ';' between builds), which the on-device job checks a dump against
// then the readiness check's rows (the profile's readiness.tsv: required / degraded rows as level|fact|min|what, ';' between them; Readiness.java) and the game's status
// on Android (its status row: playable / bring-up)
def readinessRows = { String game -> def t = new File(repo, "dm/games/$game/readiness.tsv"); t.isFile() ? t.readLines().findAll { it.trim() && !it.startsWith('#') }.collect { it.split('\t') } : [] }
def reqText = { String s -> s.replaceAll(/[\t\n\\"]/, ' ').replaceAll(/[;|]/, ',').trim() }
def reqsOf = { String game -> readinessRows(game).findAll { it.size() >= 4 && it[0] in ['required', 'degraded'] }.collect { c -> (c.take(3) + [c.drop(3).join(' ')]).collect { reqText(it) }.join('|') }.join(';') }
def statusOf = { String game -> readinessRows(game).find { it.size() >= 2 && it[0] == 'status' }?.getAt(1)?.trim() ?: '' }
// and last the shader delta rows (the profile's vk_delta.tsv "from" rows when its version is this tree's: "version=shaders to translate", ',' between them; Prepare's
// estimate for an update, ShaderLibs.toTranslate)
// Both only when the manifest is of this tree's version and holds exactly the keys Prepare builds (shaderKeysOf): a profile whose selected set changed since the manifest
// was published counts and restamps nothing from it (a phone's delta still reuses the keys the manifest has, vk_android_delta.py coverage)
def deltaCurrent = { String game, List<String> ls -> ls.contains("version\t${defineOf('dm/gfx/nvn/dmsh_chain_vk.h', 'DMSH_VK_CHAIN')}".toString()) &&
    (ls.findAll { it ==~ /[0-9a-f]{16}\t.*/ }.collect { it.substring(0, 16) } as Set) == shaderKeysOf(game) }
def deltaOf = { String game -> def f = new File(repo, "dm/games/$game/vk_delta.tsv"); if (!f.isFile()) return ''; def ls = f.readLines()
    deltaCurrent(game, ls) ? ls.findAll { it ==~ /from\t[0-9a-f]{12}\t\d+/ }.collect { def c = it.split('\t'); "${c[1]}=${c[2]}" }.join(',') : '' }
// and its "stamp" rows (an older library that becomes this version's by its header alone, ShaderLibs.restamp): "version:old SHA-256:new SHA-256", ';' between them
def stampOf = { String game -> def f = new File(repo, "dm/games/$game/vk_delta.tsv"); if (!f.isFile()) return ''; def ls = f.readLines()
    deltaCurrent(game, ls) ? ls.findAll { it ==~ /stamp\t[0-9a-f]{12}\t[0-9a-f]{64}\t[0-9a-f]{64}/ }.collect { it.split('\t').drop(1).join(':') }.join(';') : '' }
// and last what Game resolution sets for it (Profile.resolutionEnv): "window" with window_fn or res_levels rows (DM_WINDOW_SIZE: the window, or a cap on a dynamic
// resolution), "scale:<choice>=<scale>/<console|handheld>,…" with graphics_scale rows (DM_GRAPHICS_SCALE and DM_OPMODE), empty when it has none (the launcher then offers no
// Game resolution for it)
def resolutionOf = { String game -> !tsvRows(game, 'window_fn').isEmpty() || !tsvRows(game, 'res_levels').isEmpty() ? 'window' : tsvRows(game, 'graphics_scale').with { rs -> rs.isEmpty() ? '' : 'scale:' + rs.collect { c -> "${c[1].trim()}=${c[2].trim()}/${c[3].trim()}" }.join(',') } }
// The RomFS checks (game.tsv romfs_check rows, as "<path>|<line>|<expected or main>", ';' between them: Profile.romfsChecks, RomfsCheck.java)
def romfsChecksOf = { String game -> tsvRows(game, 'romfs_check').findAll { it.size() >= 4 }.collect { c -> [c[1].trim(), c[2].trim(), c[3].trim().replaceAll(/[\\"]/, ' ')].join('|') }.join(';') }
// The profile's GPU timestamp mode (game.tsv gpu_timestamps: segment or submission, the host's default when it has no row): Game settings › GPU timing names it as "Game default"
def gpuTsOf = { String game -> tsvRows(game, 'gpu_timestamps').with { rs -> rs.isEmpty() || rs[0].size() < 2 ? 'submission' : rs[0][1].trim() } }
// The profile's default Game resolution (game.tsv android_window: one of Prefs.WINDOWS; empty without the key: the main screen's default)
def windowOf = { String game -> tsvRows(game, 'android_window').with { rs -> rs.isEmpty() || rs[0].size() < 2 ? '' : rs[0][1].trim() } }
// Whether the game's speed follows its measured frame rate (game.tsv fps_decouple rows): "1", or empty. The launcher then offers a frame limit instead of 60 / 30 / 20 (Prefs.paced)
def decoupleOf = { String game -> tsvRows(game, 'fps_decouple').isEmpty() ? '' : '1' }
// Whether the host can steer the game's dynamic resolution (game.tsv drs_ctl rows): "1", or empty. The launcher then offers its Dynamic resolution setting (Prefs.drsGame)
def drsOf = { String game -> tsvRows(game, 'drs_ctl').isEmpty() ? '' : '1' }
// The profile's default frame limit (game.tsv fps_limit: frames a second, the host's limiter, hle_fpslock.c), or empty without one (0 = none). The launcher then offers a frame limit
// as for a paced game, the profile's limit its default (Prefs.limited)
def fpsLimitOf = { String game -> tsvRows(game, 'fps_limit').with { rs -> rs.isEmpty() || rs[0].size() < 2 || rs[0][1].trim() == '0' ? '' : rs[0][1].trim() } }
// Whether the game's DLSS runs on the host's stand-in upscaler (game.tsv dlss_standin rows): "1", or empty. The launcher's Upscaler row then offers the stand-in's modes, with
// Motion clarity and Temporal sharpness (Prefs.dlssGame, GameUpscaler, DlssTune: DM_VK_DLSS, DM_VK_GSR2_CLARITY, DM_VK_DLSS_SHARP)
def dlssOf = { String game -> tsvRows(game, 'dlss_standin').isEmpty() ? '' : '1' }
// Whether the profile's frame limit only paces the presents (game.tsv fps_limit_present 1): the launcher says so beside the cap (Prefs.presentOnly)
def presentOnlyOf = { String game -> tsvRows(game, 'fps_limit_present').isEmpty() ? '' : '1' }
// The pixel shaders the game's Speedhack setting drops (game.tsv skip_layers: shader keys, comma separated), or empty. The launcher then offers the toggle (Prefs.skipLayersGame)
def skipLayersOf = { String game -> tsvRows(game, 'skip_layers').with { rs -> rs.isEmpty() || rs[0].size() < 2 ? '' : rs[0][1].trim().replaceAll(/[^0-9a-fA-F,]/, '') } }
// The resolution presets of the game's windows (game.tsv res_preset + scene_output): "id|label|window|mode|height|outW|outH|measured", ';' between them (ResPresets)
def presetsOf = { String game -> tsvRows(game, 'res_preset').with { rs -> rs.isEmpty() || rs[0].size() < 2 ? '' : rs[0][1].trim().replaceAll(/[^0-9a-zA-Z|;,._-]/, '') } }
// The 3D scene choices of the game (game.tsv scene_scale with scene_scale_palette): "name|label|scale|mode", ';' between them (SceneRes)
def sceneOf = { String game -> tsvRows(game, 'scene_scale').with { rs -> rs.isEmpty() || rs[0].size() < 2 ? '' : rs[0][1].trim().replaceAll(/[^0-9a-zA-Z|;,._-]/, '') } }
// The recommended settings per phone (game.tsv recommend rows): "<match>|<setting>=<value>", ';' between them (Recommend)
def recommendOf = { String game -> tsvRows(game, 'recommend').with { rs -> rs.isEmpty() || rs[0].size() < 2 ? '' : rs[0][1].trim().replaceAll(/[^0-9a-zA-Z|=;,._-]/, '') } }
def nxProfiles = nxGames.collect { g -> [g, nameOf(g).replaceAll(/[\t\n\\"]/, ' '), shaderTotalOf(g), shaderInputsOf(g), buildsOf(g), reqsOf(g), statusOf(g), deltaOf(g), stampOf(g), resolutionOf(g), romfsChecksOf(g), gpuTsOf(g), windowOf(g), decoupleOf(g), drsOf(g), fpsLimitOf(g), dlssOf(g), presentOnlyOf(g), skipLayersOf(g), presetsOf(g), sceneOf(g), recommendOf(g), tsvRows(g, 'mesh_vegetation_cut').isEmpty() ? '' : '1'].join('\\t') }.join('\\n')
def lockOf = { String key -> def f = new File(repo, 'dm/gfx/tools/dmsh_chain.lock'); f.isFile() ? (f.readLines().find { it.startsWith(key + '\t') }?.split('\t')?.getAt(1) ?: 'unknown') : 'unknown' }

android {
    namespace 'dev.nxnative.android'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId nxLive ? 'dev.bananative.android' : nxPlay ? 'dev.nxnative.android.play' : nxApp ? "dev.nxnative.android.$nxApp" : 'dev.nxnative.android'
        resValue 'string', 'app_name', nxPlay || nxLive ? 'Banana Native' : nxApp ? nxLabel : 'Banana Native test'
        minSdk 33
        targetSdk 35
        versionCode nxVersionCode
        versionName nxVersion
        ndk { abiFilters 'arm64-v8a' }
        // The games this APK runs, with what the launcher needs of their profiles (Profile.java)
        buildConfigField 'String', 'NX_PROFILES', "\"$nxProfiles\""
        buildConfigField 'String', 'NX_COMMIT', "\"${commit ?: 'unknown'}\""
        buildConfigField 'String', 'NX_BRANCH', "\"${branch ?: 'unknown'}\""
        buildConfigField 'String', 'NX_DIRTY', "\"${commit ? dirty : ''}\""
        buildConfigField 'boolean', 'NX_LSFG', "$nxLsfg"
        // The play app and the release behave alike (saves/<id>, the user's build tag, no test switches); every other app is a test app
        buildConfigField 'boolean', 'NX_PLAY', "${nxPlay || nxLive}"
        // The public release (dev.bananative.android) alone checks GitHub for a newer release at start (Updater; a test app only through its update.txt)
        buildConfigField 'boolean', 'NX_LIVE', "$nxLive"
        // The shader library the host loads: <pack>/shaders/v-<DMSH_VK_CHAIN>/dmsh_vk.lib (vka_shader.c); the launcher checks a pack has it before starting the game
        buildConfigField 'String', 'NX_DMSH_CHAIN', "\"${defineOf('dm/gfx/nvn/dmsh_chain.h', 'DMSH_CHAIN')}\""
        buildConfigField 'String', 'NX_DMSH_VK_CHAIN', "\"${defineOf('dm/gfx/nvn/dmsh_chain_vk.h', 'DMSH_VK_CHAIN')}\""
        // Its ABI: a library of another version with it plays while the shader update makes this version's (ShaderLibs.playable, as vka_shader.c lib_load)
        buildConfigField 'String', 'NX_DMSH_VK_ABI', "\"${defineOf('dm/gfx/nvn/dmsh_chain_vk.h', 'DMSH_VK_ABI')}\""
        // and the older ABIs its host also plays (dm/gfx/vk_android/vka_abi_compat.h DMSH_VK_ABI_COMPAT, space-separated), only while that table is for this ABI (VKA_ABI_COMPAT_FOR)
        buildConfigField 'String', 'NX_DMSH_VK_ABI_COMPAT', "\"${defineOf('dm/gfx/vk_android/vka_abi_compat.h', 'VKA_ABI_COMPAT_FOR') == defineOf('dm/gfx/nvn/dmsh_chain_vk.h', 'DMSH_VK_ABI') ? defineOf('dm/gfx/vk_android/vka_abi_compat.h', 'DMSH_VK_ABI_COMPAT') : ''}\""
        buildConfigField 'String', 'NX_PACK_ENGINE', "\"$nxPackEngine\""
        // The DM_ switches some part of this build reads (docs/env_switches.tsv, which dm/tools/env_switches.py keeps current), space-separated: a user line naming
        // another DM_ variable gets a [RED] line in the game's log (Readiness.unknownSwitches; GitHub #40 had DM_VK_PS0_ASYNC, a zero for the O)
        buildConfigField 'String', 'NX_ENV_SWITCHES', "\"${new File(repo, 'docs/env_switches.tsv').readLines().drop(1).collect { it.split('\t')[0].trim() }.findAll { it ==~ /DM_[A-Z0-9_]+/ }.join(' ')}\""
        buildConfigField 'String', 'NX_XLATE_SOURCE', "\"${lockOf('xlate_source')}\""
        // The rewriter's files in pack_android.py's rewrite key (its REWRITER tuple): the launcher computes the key a pack's code must have (PackCheck)
        buildConfigField 'String', 'NX_REWRITER', "\"$nxRewriter\""
        externalNativeBuild {
            cmake {
                arguments "-DNX_GAMES=${nxGames.join(',')}", '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', "-DNX_LSFG=${nxLsfg ? 'ON' : 'OFF'}"
                // a host and its shim per game, then the custom GPU drivers' loader and hooks (DM_VK_DRIVER)
                targets(*(nxGames.collectMany { ["nxhost_$it".toString(), "nxlaunch_$it".toString()] } + ['nxadreno', 'hook_impl', 'main_hook']))
            }
        }
    }
    buildFeatures { buildConfig true }
    // The icon's variant badge: a "T" dot on the test app, none on the play app (res/drawable/ic_launcher_badge*.xml)
    sourceSets {
        main {
            res.srcDirs += nxPlay || nxLive ? 'src/variant-play/res' : 'src/variant-test/res'
            java.srcDirs += 'src/ondevice/java'
        }
        // The service and its permissions, merged over the main manifest (a build type's manifest is an overlay)
        release { manifest.srcFile 'src/ondevice/AndroidManifest.xml' }
        debug { manifest.srcFile 'src/ondevice/AndroidManifest.xml' }
    }
    signingConfigs {
        if (nxLive) live { storeFile file(signStore); storePassword signPass; keyAlias signAlias; keyPassword signPass }
    }
    buildTypes {
        debug { jniDebuggable true }
        release {
            minifyEnabled false
            debuggable !nxLive       // bring-up builds: run-as and the app's files stay reachable over adb; the release is not debuggable
            signingConfig nxLive ? signingConfigs.live : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    packaging {
        jniLibs { useLegacyPackaging false }   // stored uncompressed and 16 KB-aligned in the APK, mapped in place
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

// The log digest's tables (ExitWatch's notice, LogDigest.java): dm/tools/log_rules.tsv and log_noise.tsv, the files dm/tools/log_digest.py reads, copied at every build
// into the APK's assets/digest/ (never a copy kept in the app's sources; test_android_logdigest.py checks)
def nxDigest = tasks.register('nxDigestAssets', Sync) {
    from(new File(repo, 'dm/tools')) { include 'log_rules.tsv', 'log_noise.tsv' }
    into layout.buildDirectory.dir('generated/nxdigest/assets/digest')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/nxdigest/assets'))
tasks.named('preBuild') { dependsOn nxDigest }

// ./gradlew apk → out/nxnative-android.apk (-PnxPlay=true: nxnative-android-play.apk; -PnxApp=<suffix>: nxnative-android-<suffix>.apk)
tasks.register('apk', Copy) {
    dependsOn 'assembleRelease'
    from(layout.buildDirectory.dir('outputs/apk/release')) { include '*.apk' }
    into layout.projectDirectory.dir('out')
    rename { nxLive ? "banana-native-${nxVersion}.apk" : nxPlay ? 'nxnative-android-play.apk' : nxApp ? "nxnative-android-${nxApp}.apk" : 'nxnative-android.apk' }
}

// The on-device packer's native side (android/ONDEVICE.md "In the APK"; not with -PnxPackEngine=fake). android/ondevice/build.sh makes its stage on the Mac;
// -PnxPackStage=<that stage> (or the environment's NX_PACK_STAGE) names it. Into the APK go:
//   lib/arm64-v8a/libpython3.14.so, libnxpack.so      (jniLibs: loaded by PackNative in the :pack process only)
//   lib/arm64-v8a/libdmsh_xlate.so, libSPIRV-Tools-shared.so   the translator and the validator, which vk_android_build.py loads through ctypes in that process
//   lib/arm64-v8a/libzbicdec.so   the ZBIC decoder (dm/third_party/zstd-zbic), which nso.py loads through ctypes for the segments of system 22.0.0+ modules
//   assets/pack/python.zip   the Python home (lib/python3.14 with lib-dynload, capstone, lz4), unpacked to filesDir by PackNative
//   assets/pack/tools.zip    the repository's tools the job runs (scripts, dm/tools, dm/games/<game>, dm/gfx/tools without the Mac binaries, and the other sources DMSH_CHAIN
//                            hashes), likewise
//   assets/pack/version.txt  the two zips' digest: PackNative unpacks them again only when it changes
if (nxPackEngine == 'native') {
    def stageProp = providers.gradleProperty('nxPackStage').orElse(providers.environmentVariable('NX_PACK_STAGE')).getOrNull()
    if (!stageProp) throw new GradleException('The APK carries the on-device packer: pass -PnxPackStage=<android/ondevice/build.sh work dir>/stage (or set NX_PACK_STAGE); -PnxPackEngine=fake builds a simulated one instead')
    def stage = file(stageProp)
    def nxPack = layout.buildDirectory.dir('nxpack')
    def need = ['lib/libpython3.14.so', 'lib/libnxpack.so', 'lib/libzbicdec.so', 'lib/libdmsh_xlate.so', 'lib/libSPIRV-Tools-shared.so', 'python/lib/python3.14/os.py']
    need.each { if (!new File(stage, it).isFile()) throw new GradleException("$stage has no $it: run android/ondevice/build.sh <work dir> (it makes <work dir>/stage)") }
    // The stage's translator must be built from this tree: vk_android_build.py check_translator refuses any other on the phone, so an APK with a stale one fails
    // every Prepare at the shaders step (2026-11-10: a stage made before a translator change). xlate_tree.py --check-lib reads the digests the library embeds
    // (it is arm64 Android code: it does not run here); it runs at every build, as the stage can be rebuilt between two builds
    def xlateCheck = tasks.register('nxPackXlateCheck') {
        def lib = new File(stage, 'lib/libdmsh_xlate.so'), tool = new File(repo, 'dm/gfx/tools/xlate_tree.py')
        doLast {
            def p
            try { p = new ProcessBuilder('python3', tool.path, '--check-lib', lib.path).redirectErrorStream(true).start() }
            catch (IOException e) { throw new GradleException("python3 is needed to check $lib against this tree (dm/gfx/tools/xlate_tree.py --check-lib): $e.message") }
            def out = p.inputStream.text.trim()
            if (p.waitFor() != 0) throw new GradleException("The stage's translator was not built from this tree; the APK would fail every Prepare at the shaders step:\n$out")
            logger.lifecycle(out)
        }
    }
    def jni = tasks.register('nxPackJni', Sync) {
        dependsOn xlateCheck
        from(new File(stage, 'lib')) { include 'libpython3.14.so', 'libnxpack.so', 'libzbicdec.so', 'libdmsh_xlate.so', 'libSPIRV-Tools-shared.so' }
        into nxPack.map { it.dir('jni/arm64-v8a') }
    }
    def pyZip = tasks.register('nxPackPython', Zip) {
        from(new File(stage, 'python')) {
            exclude '**/__pycache__/**'
            exclude '**/site-packages/zbic.*', '**/site-packages/zbic-*/**'   // PyPI's zbic (GPL-2.0) from a stage made by 0.2.2's first build.sh: the APK carries libzbicdec.so instead
        }
        archiveFileName = 'python.zip'
        destinationDirectory = nxPack.map { it.dir('zips') }
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    def toolsZip = tasks.register('nxPackTools', Zip) {
        from(repo) {
            include 'scripts/*.py', 'dm/tools/*.py', 'dm/games/*.py', 'dm/gfx/nvn/*.h'
            include 'dm/tools/rewriter_equiv/*'   // earlier rewriter files of identical output: their pack keys still count (pack_android.py EQUIV, RewriteKey)
            nxGames.each { include "dm/games/$it/**" }   // the profile of each game the APK runs
            include 'dm/games/*/patches.py'   // every profile's rewriter patches: patch_nso.py lists them all in build_src.sha256, as on the Mac
            include 'dm/gfx/tools/*.py', 'dm/gfx/tools/*.lock', 'dm/gfx/tools/*.metal', 'dm/gfx/tools/*.tsv', 'dm/gfx/tools/dmsh_xlate/Program.cs', 'dm/gfx/tools/dmsh_xlate/*.csproj'
            // the other files DMSH_CHAIN hashes (dmsh_chain.py FILES): vk_android_build.py recomputes the version on the phone
            include 'dm/ios/tools/ios_metal.py', 'dm/third_party/ryujinx/src/**/*.cs', 'dm/third_party/ryujinx/src/**/*.csproj'
            // and the translator library's own sources: xlate_tree.py checks libdmsh_xlate.so was built from this tree
            include 'dm/gfx/tools/dmsh_xlate_android/*.cs', 'dm/gfx/tools/dmsh_xlate_android/*.csproj'
            exclude '**/bin/**', '**/obj/**'
            exclude '**/__pycache__/**', '**/.DS_Store'
        }
        archiveFileName = 'tools.zip'
        destinationDirectory = nxPack.map { it.dir('zips') }
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    def assets = tasks.register('nxPackAssets') {
        dependsOn pyZip, toolsZip
        def zips = nxPack.map { it.dir('zips') }
        def out = nxPack.map { it.dir('assets/pack') }
        inputs.files(pyZip, toolsZip)
        outputs.dir out
        doLast {
            def o = out.get().asFile
            project.delete(o); o.mkdirs()
            def md = java.security.MessageDigest.getInstance('SHA-256')
            ['python.zip', 'tools.zip'].each { n ->
                def f = zips.get().file(n).asFile
                md.update(n.bytes); md.update(f.bytes)
                java.nio.file.Files.copy(f.toPath(), new File(o, n).toPath())
            }
            new File(o, 'version.txt').text = md.digest().encodeHex().toString().substring(0, 16) + '\n'
        }
    }
    android.sourceSets.main.jniLibs.srcDir(nxPack.map { it.dir('jni') })
    android.sourceSets.main.assets.srcDir(nxPack.map { it.dir('assets') })
    android.androidResources.noCompress.add('zip')   // the zips are deflated already; stored, they are read from the APK as they are
    tasks.named('preBuild') { dependsOn jni, assets }
}
