name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 强行建好它需要的目录
        mkdir -p work/dl
        
        # 2. 我们自己动手把 Python 下载到正确的位置！
        echo "Downloading Python..."
        wget -q -O work/dl/python-3.14.6-aarch64-linux-android.tar.gz https://www.python.org/ftp/python/3.14.6/python-3.14.6-aarch64-linux-android.tar.gz || true
        
        # 3. 修复换行符
        sed -i 's/\r$//' build.sh
        
        # 4. 魔法补丁：强行删掉 build.sh 里下载 Python 的那行代码，防止它又搞破坏
        # 查找包含 curl 和 python-3.14 的行，把它注释掉
        sed -i '/curl.*python-3.14/s/^/# /g' build.sh
        
        chmod +x build.sh
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
