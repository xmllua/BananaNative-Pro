name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 检查磁盘空间
        df -h
        
        # 2. 修复换行符
        sed -i 's/\r$//' build.sh
        
        # 3. 终极魔法：给所有 curl 命令加上 --create-dirs 参数
        # 这样即使它把 URL 当成路径，curl 也会自动创建带冒号的奇葩文件夹
        sed -i 's/curl /curl --create-dirs /g' build.sh
        
        # 4. 双重保险：手动创建核心的 work 目录
        mkdir -p "work/dl/https:"
        
        chmod +x build.sh
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
