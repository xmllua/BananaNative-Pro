name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 强行建好畸形目录，防止 curl 写入失败
        mkdir -p "work/dl/https:/www.python.org/ftp/python/3.14.6"
        
        # 2. 强行修改 build.sh 里的死链，替换成真正能下到的 Python 版本（Python 3.12）
        sed -i 's|https://www.python.org/ftp/python/3.14.6/python-3.14.6-aarch64-linux-android.tar.gz|https://github.com/termux/termux-packages/releases/download/python-3.12.7-1/python_3.12.7_aarch64.deb|g' build.sh
        
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
