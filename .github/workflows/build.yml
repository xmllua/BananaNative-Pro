name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 检查磁盘空间
        df -h
        
        # 2. 修复换行符
        sed -i 's/\r$//' build.sh
        
        # 3. 核心魔法：强行把 curl 后面的 -o (小写) 参数全部替换成 -O (大写)
        # 因为原作者脚本里写的是把 URL 当文件名，用 -O 才会自动识别真实文件名
        sed -i 's/curl \(.*\)-o .*/curl \1-O/g' build.sh
        sed -i 's/-o \.\/work\/dl\/https[^ ]*/-O/g' build.sh
        
        chmod +x build.sh
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
