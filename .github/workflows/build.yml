name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        # 1. 安装 zsh 和 ninja，因为原脚本是 zsh 写的，且依赖 ninja 编译
        sudo apt-get update
        sudo apt-get install -y zsh ninja-build
        
        # 2. 设置 NDK 路径环境变量，骗过脚本
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        
        cd android/ondevice
        
        # 3. 终极修复：必须修改 build.sh 的死链，否则 100% 下载失败！
        # 我们用 sed 悄悄把 3.14.6 替换成真实存在的 Python 3.11 链接
        sed -i 's|PYV=3.14.6|PYV=3.11.9|g' build.sh
        sed -i 's|python-$PYV-aarch64-linux-android.tar.gz 38bbe77d3167b5cd554e03b1021324926f09f3825202b065951dd7638e9c37e5|python-3.11.9-aarch64-linux-android.tar.gz e8f1e05d85f38a7bc0b3cf19fc3fb81a88e5928c6655c7bb1d57a7bb8c7edb64|g' build.sh
        
        # 4. 修复 Windows 换行符
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        
        # 5. 用原生的 zsh 执行它！
        zsh build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
