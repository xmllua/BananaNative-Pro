name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 检查磁盘空间
        df -h
        
        # 2. 终极防御：完全不动源码，纯靠我们手动把“畸形路径”建出来！
        # 原作者把 URL 当成了目录，我们就把这个带冒号和斜杠的奇葩目录建好
        mkdir -p "work/dl/https:/www.python.org/ftp/python/3.14.6"
        mkdir -p "work/dl/https:/files.pythonhosted.org/packages/d/9c/28b11f64e2425774efb21c206a6e952cfce6e3e2ef3e4b63cdae32ccd8a5"
        
        # 3. 仅仅修复 Windows 换行符（这不算改代码逻辑，是为了能在 Linux 跑）
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        
        # 4. 原汁原味执行脚本
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
