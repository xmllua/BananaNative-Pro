name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 劫持 curl 命令！写一个同名脚本放到系统路径最前面
        cat << 'EOF' > /usr/local/bin/curl
        #!/bin/bash
        args=("$@")
        new_args=()
        skip_next=false
        for ((i=0; i<${#args[@]}; i++)); do
            if [ "$skip_next" = true ]; then
                skip_next=false
                continue
            fi
            arg="${args[$i]}"
            if [ "$arg" == "-o" ]; then
                next_arg="${args[$((i+1))]}"
                if [[ "$next_arg" == *"http://"* ]] || [[ "$next_arg" == *"https://"* ]]; then
                    # 发现它想把网址当路径，我们直接把“畸形目录”建出来，并提取出正常文件名
                    target_dir=$(dirname "$next_arg")
                    filename=$(basename "$next_arg")
                    mkdir -p "$target_dir"
                    new_args+=("-o" "$target_dir/$filename")
                    skip_next=true
                    continue
                fi
            fi
            new_args+=("$arg")
        done
        # 调用系统真正的 curl 来下载
        exec /usr/bin/curl "${new_args[@]}"
        EOF
        chmod +x /usr/local/bin/curl
        
        # 2. 仅仅修复 Windows 换行符（不改逻辑），并赋予权限
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        
        # 3. 原汁原味执行源码，绝不修改它内部任何一行！
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
