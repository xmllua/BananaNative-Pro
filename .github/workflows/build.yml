name: Build with FSR 3.1 and Chinese

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. 自动下载并注入 FSR 3.1 补丁
    - name: Apply FSR 3.1 Patch
      run: |
        echo "正在尝试下载 PR #151 补丁..."
        wget -q https://git.eden-emu.dev/moceure/BananaNative/pulls/151.patch -O pr151.patch || true
        
        if [ -s pr151.patch ]; then
          echo "补丁下载成功，尝试应用..."
          git apply --3way --ignore-whitespace pr151.patch || echo "⚠️ 补丁应用失败，将跳过。"
        else
          echo "⚠️ 补丁下载失败。"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    # 2. 生成固定签名
    - name: 生成固定签名证书
      run: |
        if [ ! -f my-release-key.jks ]; then
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias my-alias -storepass 123456 -keypass 123456 \
            -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US"
        fi

    # 3. 暴力汉化 (核心修复：加上了"FSR" not in en判断，放过FSR的开关)
    - name: 暴力汉化
      run: |
        cat << 'EOF' > translate.py
        import os
        translations = {
            "Settings": "设置", "UPDATES": "更新", "GAME DEFAULTS": "游戏默认", "SYSTEM": "系统", "HELP": "帮助", "ABOUT": "关于",
            "Check for updates": "检查更新", "Overlay": "悬浮窗", "On-screen controls": "屏幕虚拟按键", "Show / hide button": "显示/隐藏按钮",
            "Controller: in-game panel": "手柄：游戏内面板", "Resolution": "分辨率", "Frame rate cap": "帧率上限", "Rumble": "震动", 
            "Use fast cores": "使用大核", "Xbox button label swap": "Xbox按键互换", "Button mapping": "按键映射", "Upscaler": "超分", 
            "Dynamic resolution": "动态分辨率", "Frame generation": "帧生成", "GPU driver": "GPU驱动", "Folders": "文件夹", 
            "Storage": "存储空间", "Readiness check": "设备检查", "Graphics self-test": "图形自检", "Share log": "分享日志",
            "Games in this app:": "支持的游戏：", "Donkey Kong Bananza": "大金刚：蕉力全开", "Mario Kart World": "马力欧卡丁车：世界", 
            "The Legend of Zelda: Ocarina of Time": "塞尔达传说：时之笛", "Pokemon Pokopia": "宝可梦 Pokopia", "Splatoon Raiders": "斯普拉遁：Raiders",
            "Fire Emblem Fortune's Weave": "火焰纹章：万缕千丝", "On": "开启", "Off": "关闭", "Default": "默认"
        }
        for root, dirs, files in os.walk("android/app/src/main"):
            for file in files:
                if file.endswith((".kt", ".java", ".xml")):
                    filepath = os.path.join(root, file)
                    with open(filepath, "r", encoding="utf-8") as f: 
                        content = f.read()
                    modified = False
                    for en, zh in translations.items():
                        # 关键修复：如果英文里包含"FSR"，直接跳过，绝不误伤新加的开关
                        if "FSR" in en:
                            continue
                        
                        if f'"{en}"' in content: 
                            content = content.replace(f'"{en}"', f'"{zh}"')
                            modified = True
                        if f"'{en}'" in content: 
                            content = content.replace(f"'{en}'", f"'{zh}'")
                            modified = True
                        if f'>{en}<' in content: 
                            content = content.replace(f'>{en}<', f'>{zh}<')
                            modified = True
                            
                    if modified:
                        with open(filepath, "w", encoding="utf-8") as f: 
                            f.write(content)
        EOF
        python3 translate.py

    # 4. 编译打包
    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        
        ./gradlew assembleDebug -PnxPackEngine=fake \
          -Pandroid.injected.signing.store.file=$(pwd)/../../my-release-key.jks \
          -Pandroid.injected.signing.store.password=123456 \
          -Pandroid.injected.signing.key.alias=my-alias \
          -Pandroid.injected.signing.key.password=123456

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Chinese-Signed-FSR-Fixed
        path: android/app/build/outputs/apk/debug/*.apk
