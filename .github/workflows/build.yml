name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 写一个假的 curl，拦截原作者的沙雕下载逻辑
        mkdir -p /tmp/fakebin
        cat << 'EOF' > /tmp/fakebin/curl
        #!/bin/bash
        REAL_CURL=/usr/bin/curl
        URL="${@: -1}"
        if [[ "$URL" == http* ]]; then
            filename=$(basename "$URL")
            mkdir -p ./work/dl
            # 强行用正确的文件名下载到 ./work/dl/ 目录
            $REAL_CURL -L -o "./work/dl/$filename" "$URL"
            exit $?
        fi
        $REAL_CURL "$@"
        EOF
        chmod +x /tmp/fakebin/curl
        
        # 2. 把这个假 curl 塞进系统路径的最前面
        export PATH="/tmp/fakebin:$PATH"
        
        # 3. 修复一下脚本的 Windows 换行符（这仅仅是转换格式，绝对没动它一行逻辑）
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        
        # 4. 原汁原味执行它！
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
