name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        # 1. 抛弃 apt，直接下载 ninja 二进制包（绕过 DNS 抽风）
        wget -q -O ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-linux.zip
        unzip ninja.zip
        chmod +x ninja
        sudo mv ninja /usr/local/bin/
        
        # 2. 设置 NDK 环境变量
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        cd android/ondevice
        
        # 3. 把 zsh 专属语法改成 bash 兼容语法 (这就是之前 bash 报错的根源)
        sed -i 's|HERE=${0:A:h}|HERE=$(cd "$(dirname "$0")" \&\& pwd)|g' build.sh
        sed -i 's|W=${1:?usage: build.sh <work dir> [all|python|tools|zbic]}|W=${1:?}|g' build.sh
        sed -i 's|local f=$W/dl/${1:t}|local f=$W/dl/$(basename "$1")|g' build.sh
        
        # 4. 修复死链：把 3.14.6 换成真实存在的 3.11.9
        sed -i 's|PYV=3.14.6|PYV=3.11.9|g' build.sh
        sed -i 's|python-$PYV-aarch64-linux-android.tar.gz 38bbe77d3167b5cd554e03b1021324926f09f3825202b065951dd7638e9c37e5|python-3.11.9-aarch64-linux-android.tar.gz e8f1e05d85f38a7bc0b3cf19fc3fb81a88e5928c6655c7bb1d57a7bb8c7edb64|g' build.sh
        
        # 5. 修复换行符，用 bash 强行跑！
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
