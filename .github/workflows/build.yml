name: Build BananaNative Full APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        
        # 1. 打印磁盘空间防爆
        df -h
        
        # 2. 终极魔法：在运行前，强行修改 build.sh 里的沙雕下载逻辑！
        # 它原本会把路径写成 "-o ./work/dl/https://..."，我们强制用 sed 删掉这个错误的路径，让 curl 自动识别文件名。
        sed -i 's|-o \.\/work\/dl\/[^ ]*|-O|g' build.sh
        sed -i 's|-o .*https.*|-O|g' build.sh
        
        # 3. 修复换行符并赋权
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        
        # 4. 执行脚本
        bash build.sh ./work all

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/work/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
