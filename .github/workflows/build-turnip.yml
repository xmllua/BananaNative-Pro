name: Build Turnip Driver

# Builds Mesa's Turnip (freedreno Vulkan) for Android arm64 and packs it the way the launcher's
# GPU driver folder expects: <name>/libvulkan_freedreno.so plus a meta.json.
# Download the artifact, install the zip with Settings > GPU driver.
#
# ---------------------------------------------------------------------------------------------
# WHICH MESA
# The driver this repo's users run is Turnip_Gen8_V39, and its own readiness line names it:
#   driver turnip Mesa driver (Mesa 27.0.0-devel (git-2648b2059f))
# So the default MESA_REF below is `main`, which is the 27.x devel line that commit belongs to.
#
# Do NOT use a release branch (mesa-25.2.0, 25.3, 26.x) for an Adreno 840: none of them has the
# a840 in src/freedreno/common/freedreno_devices.py (checked: 25.2 has no a8xx at all, 25.3 and
# 26.0 none, 26.1 only a830, main has a830 + a840). A driver built from those branches loads fine
# but enumerates no physical device ("[RED] vk: no Vulkan physical device"), which is exactly what
# the first turnip-CI run did.
# ---------------------------------------------------------------------------------------------
#
# Build-scope decisions (each one came from a failing run of this workflow):
#  1. Vulkan only: no Gallium freedreno. With Gallium freedreno enabled, Mesa forces Turnip to link
#     libdrm (meson.build) and src/util/u_sync_provider.c needs <xf86drm.h>, which does not exist
#     for the Android target.
#  2. No glvnd / GL / EGL: nothing in the Vulkan driver needs them.
#  3. No SPIRV-Tools: host-only dependency, only required for mesa-clc. If it is installed meson
#     defines HAVE_SPIRV_TOOLS and src/compiler/spirv/vtn_debug.c includes <spirv-tools/libspirv.h>,
#     which the Android cross-compile cannot resolve.
#  4. zlib from the NDK sysroot: dependency('zlib') otherwise resolves to the host libz and the
#     link fails with "ld.lld: error: libz.so is incompatible with aarch64linux".

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa branch/tag/commit (main = 27.x devel, the line Turnip V39 came from)'
        required: true
        default: 'main'
      driver_name:
        description: 'Driver folder name shown in the launcher'
        required: true
        default: 'Turnip-CI'
      build_type:
        description: 'release or debug'
        required: true
        default: 'release'

jobs:
  build-turnip:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
          df -h /
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git python3-pip pkg-config \
            bison flex ninja-build git-lfs \
            glslang-tools zlib1g-dev \
            python3-setuptools python3-mako python3-numpy python3-yaml python3-ply
          # keep the host-only SPIRV-Tools out: see header note 3
          sudo apt-get remove -y -qq spirv-tools libspirv-tools-dev 2>/dev/null || true
          sudo rm -rf /usr/lib/*/cmake/SPIRV-Tools /usr/lib/cmake/SPIRV-Tools \
                     /usr/lib/*/pkgconfig/SPIRV-Tools.pc /usr/lib/pkgconfig/SPIRV-Tools.pc || true
          pip3 install --break-system-packages --upgrade "meson>=1.4" mako
          hash -r
          meson --version
      - name: Set up Android NDK
        run: |
          NDK_VERSION=r27c
          echo "NDK_VERSION=$NDK_VERSION" >> $GITHUB_ENV
          curl -sSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
      - name: Point zlib at the NDK sysroot
        run: |
          # see header note 4
          API=34
          SYS=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          test -f $SYS/usr/include/zlib.h && echo "OK: NDK zlib.h found"
          mkdir -p /tmp/android-pc
          cat > /tmp/android-pc/zlib.pc <<EOF
prefix=$SYS/usr
libdir=\${prefix}/lib/aarch64-linux-android/$API
includedir=\${prefix}/include

Name: zlib
Description: zlib compression library (Android NDK)
Version: 1.3
Libs: -L\${libdir} -lz
Cflags: -I\${includedir}
EOF
          sed -i 's/^ *//' /tmp/android-pc/zlib.pc
          cat /tmp/android-pc/zlib.pc
          echo "PKG_CONFIG_LIBDIR=/tmp/android-pc" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=" >> $GITHUB_ENV
      - name: Fetch Mesa
        env:
          MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          git init mesa && cd mesa
          git remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          # a branch, a tag or a commit; fall back to a plain clone when the shallow fetch is refused
          git fetch --depth 1 origin "$MESA_REF" || git fetch --depth 1 origin main
          git checkout -q FETCH_HEAD
          git log --oneline -1
          echo "MESA_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Check the device table has your GPU
        env:
          MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          cd mesa
          # Refuse to build a driver that cannot enumerate the phone's GPU. This is the check the
          # first CI driver was missing: it built, loaded, and found no physical device.
          DEV=src/freedreno/common/freedreno_devices.py
          test -f $DEV || { echo "::error::$DEV not found; HEAD is $(git rev-parse --short HEAD)"; exit 1; }
          echo "--- Adreno 8xx entries in $DEV ---"
          grep -oE 'a8[0-9]{2}[a-z_]*' $DEV | sort -u | tr '\n' ' '; echo
          if ! grep -q 'a840' $DEV; then
            echo "::error::this Mesa has no Adreno 840 in the device table: a driver built from it reports no Vulkan physical device on the phone. Use mesa_ref=main (27.x devel, the line Turnip V39 came from) or a commit that has a840."
            exit 1
          fi
          echo "OK: a840 present"
          grep -n -A3 'a840' $DEV | head -20
      - name: Configure (cross file for Android arm64)
        env:
          BT: ${{ github.event.inputs.build_type }}
        run: |
          cat > /tmp/android-aarch64.txt <<EOF
[binaries]
c = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang'
cpp = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++'
ar = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkg-config = 'pkg-config'
[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
[properties]
android_api_level = 34
EOF
          cd mesa
          meson setup build-android \
            --cross-file /tmp/android-aarch64.txt \
            --buildtype="$BT" \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dbuild-tests=false \
            -Dgallium-rusticl=false \
            -Dglx=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dzstd=disabled \
            -Dllvm=disabled \
            -Dtools= \
            -Dvideo-codecs= \
            --wrap-mode=nodownload
      - name: Build
        run: |
          cd mesa
          ninja -C build-android src/freedreno/vulkan/libvulkan_freedreno.so -j$(nproc)
          ls -la build-android/src/freedreno/vulkan/libvulkan_freedreno.so
      - name: Check the driver's runtime dependencies
        run: |
          cd mesa
          SO=build-android/src/freedreno/vulkan/libvulkan_freedreno.so
          READELF=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          $READELF -d $SO | sed -n '1,40p'
          for bad in libdrm libGL libEGL libX11 libwayland-client; do
            if $READELF -d $SO | grep -q "$bad"; then
              echo "::error::driver links $bad, which does not exist on the phone"
              exit 1
            fi
          done
          echo "OK: the driver only links Android system libraries"
      - name: Check the driver names your GPU
        run: |
          cd mesa
          SO=build-android/src/freedreno/vulkan/libvulkan_freedreno.so
          if $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings $SO | grep -q 'Adreno (TM) 840'; then
            echo "OK: the driver carries the Adreno 840 device entry"
          else
            echo "::warning::'Adreno (TM) 840' not found in the built .so; the device table may not have been compiled in"
          fi
      - name: Package driver folder
        env:
          NAME: ${{ github.event.inputs.driver_name }}
          MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          mkdir -p out/$NAME
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so out/$NAME/
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/$NAME/libvulkan_freedreno.so || true
          cat > out/$NAME/meta.json <<EOF
{
  "name": "$NAME",
  "description": "Turnip built by CI from $MESA_REF ($MESA_COMMIT)",
  "author": "Mesa / freedreno",
  "vendor": "Mesa",
  "driverVersion": "$MESA_REF-$MESA_COMMIT",
  "minApi": 34,
  "libraryName": "libvulkan_freedreno.so"
}
EOF
          ls -la out/$NAME/
          cat out/$NAME/meta.json
      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.driver_name }}-${{ env.MESA_COMMIT }}
          path: out/
          retention-days: 30