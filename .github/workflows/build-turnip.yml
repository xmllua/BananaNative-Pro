name: Build Turnip Driver

# Builds Mesa's Turnip (freedreno Vulkan) for Android arm64 and packs it the way the launcher's
# GPU driver folder expects: <name>/libvulkan_freedreno.so plus a meta.json. The APK is not touched:
# download the artifact, unzip it into the phone's
#   Android/data/dev.nxnative.androie/files/gpu_drivers/<name>/
# and pick it in Settings > GPU driver.
#
# Mesa source: the branch/tag below (change MESA_REF to try another build). The default is the
# 25.2 branch, which is the line Turnip V39 came from.
#
# Build-scope decisions (each one came from a failing run):
#  1. Vulkan only: no Gallium freedreno. With Gallium freedreno enabled, Mesa forces Turnip to link
#     libdrm (meson.build:294) and src/util/u_sync_provider.c needs <xf86drm.h>, which does not exist
#     for the Android target -> runs 1..7 all died at "u_sync_provider.c: fatal error: 'xf86drm.h'".
#  2. No glvnd / GL / EGL: nothing in the driver needs them, they only drag host GL deps in.
#  3. No SPIRV-Tools: it is a host-only dependency (meson.build:1834, only required when with_clc).
#     If the package is installed in the image, meson finds it, defines HAVE_SPIRV_TOOLS, and
#     src/compiler/spirv/vtn_debug.c then includes <spirv-tools/libspirv.h>, which the Android
#     cross-compile cannot resolve (run 8). Leaving the package out keeps that macro undefined.

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa branch or tag to build (e.g. mesa-25.2.0, main)'
        required: true
        default: 'mesa-25.2.0'
      driver_name:
        description: 'Driver folder name shown in the launcher'
        required: true
        default: 'Turnip-CI'
      build_type:
        description: 'release or debug'
        required: true
        default: 'release'

jobs:
  build-turnip:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
          df -h /
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git python3-pip pkg-config \
            bison flex ninja-build git-lfs \
            glslang-tools zlib1g-dev \
            python3-setuptools python3-mako python3-numpy python3-yaml
          # The host-only SPIRV-Tools files must be gone, otherwise dep_spirv_tools is found and
          # HAVE_SPIRV_TOOLS makes vtn_debug.c include a header the Android target cannot see.
          sudo apt-get remove -y -qq spirv-tools libspirv-tools-dev 2>/dev/null || true
          sudo rm -rf /usr/lib/*/cmake/SPIRV-Tools /usr/lib/cmake/SPIRV-Tools \
                     /usr/lib/*/pkgconfig/SPIRV-Tools.pc /usr/lib/pkgconfig/SPIRV-Tools.pc || true
          pip3 install --break-system-packages --upgrade "meson>=1.4" mako
          hash -r
          meson --version
      - name: Set up Android NDK
        run: |
          NDK_VERSION=r27c
          echo "NDK_VERSION=$NDK_VERSION" >> $GITHUB_ENV
          curl -sSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
      - name: Point zlib at the NDK sysroot
        run: |
          # dependency('zlib') resolved to the *host* libz (/usr/lib/x86_64-linux-gnu/libz.so) and the
          # final link failed with "ld.lld: error: libz.so is incompatible with aarch64linux" (run 9).
          # The NDK ships its own libz for every API level, so hand meson a pkg-config file that
          # points there and make sure the host pkg-config dirs are not searched.
          API=34
          SYS=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          test -f $SYS/usr/include/zlib.h && echo "OK: NDK zlib.h found"
          mkdir -p /tmp/android-pc
          cat > /tmp/android-pc/zlib.pc <<EOF
          prefix=$SYS/usr
          libdir=\${prefix}/lib/aarch64-linux-android/$API
          includedir=\${prefix}/include
          
          Name: zlib
          Description: zlib compression library (Android NDK)
          Version: 1.3
          Libs: -L\${libdir} -lz
          Cflags: -I\${includedir}
          EOF
          # the heredoc above inherits the YAML block indentation, strip it so pkg-config can parse
          sed -i 's/^ *//' /tmp/android-pc/zlib.pc
          cat /tmp/android-pc/zlib.pc
          echo "PKG_CONFIG_LIBDIR=/tmp/android-pc" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=" >> $GITHUB_ENV
      - name: Fetch Mesa
        env:
          MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa || {
              echo "::error::branch $MESA_REF not found; trying as a tag"
              git clone --depth 1 --branch "$MESA_REF" https://gitlab.freedesktop.org/mesa/mesa.git mesa
            }
          cd mesa && git log --oneline -1
      - name: Configure (cross file for Android arm64)
        env:
          BT: ${{ github.event.inputs.build_type }}
        run: |
          cat > /tmp/android-aarch64.txt <<EOF
          [binaries]
          c = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang'
          cpp = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++'
          ar = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          android_api_level = 34
          EOF
          cd mesa
          meson setup build-android \
            --cross-file /tmp/android-aarch64.txt \
            --buildtype="$BT" \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dbuild-tests=false \
            -Dgallium-rusticl=false \
            -Dglx=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dzstd=disabled \
            -Dllvm=disabled \
            -Dtools= \
            -Dvideo-codecs= \
            --wrap-mode=nodownload
      - name: Build
        run: |
          cd mesa
          ninja -C build-android src/freedreno/vulkan/libvulkan_freedreno.so -j$(nproc)
          ls -la build-android/src/freedreno/vulkan/libvulkan_freedreno.so
      - name: Check the driver's runtime dependencies
        run: |
          cd mesa
          SO=build-android/src/freedreno/vulkan/libvulkan_freedreno.so
          READELF=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          $READELF -d $SO | sed -n '1,40p'
          for bad in libdrm libGL libEGL libX11 libwayland-client; do
            if $READELF -d $SO | grep -q "$bad"; then
              echo "::error::driver links $bad, which does not exist on the phone"
              exit 1
            fi
          done
          echo "OK: the driver only links Android system libraries"
      - name: Package driver folder
        env:
          NAME: ${{ github.event.inputs.driver_name }}
          MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          mkdir -p out/$NAME
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so out/$NAME/
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/$NAME/libvulkan_freedreno.so || true
          MESA_VER=$(cd mesa && git describe --tags --always 2>/dev/null || echo unknown)
          MESA_COMMIT=$(cd mesa && git rev-parse --short HEAD)
          cat > out/$NAME/meta.json <<EOF
          {
            "name": "$NAME",
            "description": "Turnip built by CI from $MESA_REF ($MESA_COMMIT)",
            "author": "Mesa / freedreno",
            "vendor": "Mesa",
            "driverVersion": "$MESA_VER",
            "minApi": 34,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          ls -la out/$NAME/
          cat out/$NAME/meta.json
      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.driver_name }}-${{ github.event.inputs.mesa_ref }}
          path: out/
          retention-days: 30