name: Build Turnip Driver

# Builds Mesa's Turnip (freedreno Vulkan) for Android arm64, packed as the launcher's GPU driver
# folder: <name>/libvulkan_freedreno.so plus a meta.json. Install the artifact zip with
# Settings > GPU driver.
#
# WHICH MESA: the driver people run here is Turnip_Gen8_V39 and its readiness line names it
#   Mesa 27.0.0-devel (git-2648b2059f)
# so MESA_REF defaults to main (the 27.x devel line). No release branch works on an Adreno 840:
# 25.2 and 25.3 and 26.0 have no a8xx entry, 26.1 has only a830, main has a830 and a840. A driver
# built without the a840 entry loads but enumerates no physical device, which is what the first
# CI driver did ("vk: no Vulkan physical device").
#
# Scope (each item came from a failing run):
#  1. Vulkan only, no Gallium freedreno: otherwise Mesa forces Turnip to link libdrm and
#     src/util/u_sync_provider.c needs xf86drm.h, absent for the Android target.
#  2. No glvnd/GL/EGL: the Vulkan driver needs none of them.
#  3. No SPIRV-Tools: host-only, only for mesa-clc. If present meson defines HAVE_SPIRV_TOOLS and
#     src/compiler/spirv/vtn_debug.c includes spirv-tools/libspirv.h, unreachable cross-compiled.
#  4. zlib from the NDK sysroot: otherwise it resolves to the host libz and the link fails with
#     "libz.so is incompatible with aarch64linux".

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa branch, tag or commit (main is the 27.x devel line of Turnip V39)'
        required: true
        default: main
      driver_name:
        description: 'Driver folder name shown in the launcher'
        required: true
        default: Turnip-CI
      build_type:
        description: 'release or debug'
        required: true
        default: release

jobs:
  build-turnip:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
          df -h /
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git python3-pip pkg-config \
            bison flex ninja-build git-lfs \
            glslang-tools zlib1g-dev \
            python3-setuptools python3-mako python3-numpy python3-yaml python3-ply
          sudo apt-get remove -y -qq spirv-tools libspirv-tools-dev 2>/dev/null || true
          sudo rm -rf /usr/lib/*/cmake/SPIRV-Tools /usr/lib/cmake/SPIRV-Tools \
                     /usr/lib/*/pkgconfig/SPIRV-Tools.pc /usr/lib/pkgconfig/SPIRV-Tools.pc || true
          pip3 install --break-system-packages --upgrade "meson>=1.4" mako
          hash -r
          meson --version
      - name: Set up Android NDK
        run: |
          NDK_VERSION=r27c
          echo "NDK_VERSION=$NDK_VERSION" >> $GITHUB_ENV
          curl -sSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
      - name: Point zlib at the NDK sysroot
        run: |
          API=34
          SYS=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          test -f $SYS/usr/include/zlib.h && echo "OK: NDK zlib.h found"
          mkdir -p /tmp/android-pc
          cat > /tmp/android-pc/zlib.pc <<EOF
prefix=$SYS/usr
libdir=\${prefix}/lib/aarch64-linux-android/$API
includedir=\${prefix}/include

Name: zlib
Description: zlib compression library (Android NDK)
Version: 1.3
Libs: -L\${libdir} -lz
Cflags: -I\${includedir}
EOF
          sed -i 's/^ *//' /tmp/android-pc/zlib.pc
          cat /tmp/android-pc/zlib.pc
          echo "PKG_CONFIG_LIBDIR=/tmp/android-pc" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=" >> $GITHUB_ENV
      - name: Fetch Mesa
        env:
          MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          git init mesa && cd mesa
          git remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch --depth 1 origin "$MESA_REF" || git fetch --depth 1 origin main
          git checkout -q FETCH_HEAD
          git log --oneline -1
          echo "MESA_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Check the device table has the phone GPU
        run: |
          cd mesa
          DEV=src/freedreno/common/freedreno_devices.py
          test -f $DEV || { echo "no $DEV at $(git rev-parse --short HEAD)"; exit 1; }
          echo "--- Adreno 8xx entries ---"
          grep -oE 'a8[0-9]{2}[a-z_]*' $DEV | sort -u | tr '\n' ' '; echo
          if ! grep -q 'a840' $DEV; then
            echo "no Adreno 840 in this Mesa: the driver would report no Vulkan physical device. Use mesa_ref=main or a commit that has a840."
            exit 1
          fi
          echo "OK: a840 present"
          grep -n -A3 'a840' $DEV | head -20
      - name: Configure
        env:
          BT: ${{ github.event.inputs.build_type }}
        run: |
          cat > /tmp/android-aarch64.txt <<EOF
[binaries]
c = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang'
cpp = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++'
ar = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkg-config = 'pkg-config'
[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
[properties]
android_api_level = 34
EOF
          cd mesa
          meson setup build-android \
            --cross-file /tmp/android-aarch64.txt \
            --buildtype="$BT" \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dbuild-tests=false \
            -Dgallium-rusticl=false \
            -Dglx=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dzstd=disabled \
            -Dllvm=disabled \
            -Dtools= \
            -Dvideo-codecs= \
            --wrap-mode=nodownload
      - name: Build
        run: |
          cd mesa
          ninja -C build-android src/freedreno/vulkan/libvulkan_freedreno.so -j$(nproc)
          ls -la build-android/src/freedreno/vulkan/libvulkan_freedreno.so
      - name: Check runtime dependencies
        run: |
          cd mesa
          SO=build-android/src/freedreno/vulkan/libvulkan_freedreno.so
          READELF=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          $READELF -d $SO | sed -n '1,40p'
          for bad in libdrm libGL libEGL libX11 libwayland-client; do
            if $READELF -d $SO | grep -q "$bad"; then
              echo "driver links $bad, absent on the phone"; exit 1
            fi
          done
          echo "OK: only Android system libraries"
      - name: Check the driver names the phone GPU
        run: |
          cd mesa
          SO=build-android/src/freedreno/vulkan/libvulkan_freedreno.so
          if $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings $SO | grep -q 'Adreno (TM) 840'; then
            echo "OK: the a840 device entry is in the built .so"
          else
            echo "note: 'Adreno (TM) 840' not found by strings; the table may not be compiled in"
          fi
      - name: Package driver folder
        env:
          NAME: ${{ github.event.inputs.driver_name }}
          MESA_REF: ${{ github.event.inputs.mesa_ref }}
        run: |
          mkdir -p out/$NAME
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so out/$NAME/
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/$NAME/libvulkan_freedreno.so || true
          cat > out/$NAME/meta.json <<EOF
{
  "name": "$NAME",
  "description": "Turnip built from $MESA_REF ($MESA_COMMIT)",
  "author": "Mesa / freedreno",
  "vendor": "Mesa",
  "driverVersion": "$MESA_REF-$MESA_COMMIT",
  "minApi": 34,
  "libraryName": "libvulkan_freedreno.so"
}
EOF
          ls -la out/$NAME/
          cat out/$NAME/meta.json
      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.driver_name }}-${{ env.MESA_COMMIT }}
          path: out/
          retention-days: 30